<style>
:root{
  --bg:#081521; --bg2:#0b1f30; --panel:rgba(255,255,255,.04); --panel-b:rgba(212,175,90,.18);
  --ink:#e9e2cf; --muted:#9fb0bd; --gold:#d4af5a; --gold-2:#f0cd7a; --red:#b1291b; --red-2:#d1432f;
  --line:rgba(255,255,255,.08); --radius:14px; --font-d:'Lalezar',sans-serif; --font-b:'Vazirmatn',sans-serif;
}
[data-theme="light"]{
  --bg:#f3ecd9; --bg2:#ece0bf; --panel:rgba(255,255,255,.55); --panel-b:rgba(120,90,20,.18);
  --ink:#25190c; --muted:#5b4a30; --gold:#9c6e17; --gold-2:#7a560f; --red:#a3271a; --red-2:#7d1d13;
  --line:rgba(0,0,0,.08);
}
*{box-sizing:border-box;} html{scroll-behavior:smooth;}
body{margin:0; background:radial-gradient(1200px 700px at 15% -10%, var(--bg2), var(--bg) 60%); color:var(--ink); font-family:var(--font-b); line-height:1.85; min-height:100vh; transition:background .3s, color .3s;}
a{color:inherit; text-decoration:none;}
h1,h2,h3,.disp{font-family:var(--font-d); font-weight:400; letter-spacing:.3px;}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px;}
img,svg{max-width:100%; display:block;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold); color:#111;}

/* ---- topbar ---- */
.topbar{position:sticky; top:0; z-index:50; backdrop-filter:blur(14px); background:rgba(8,21,33,.72); border-bottom:1px solid var(--line);}
[data-theme="light"] .topbar{background:rgba(243,236,217,.8);}
.topbar-in{display:flex; align-items:center; gap:18px; padding:14px 20px; max-width:1180px; margin:0 auto;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-d); font-size:1.5rem; color:var(--gold-2);}
.brand .skull{width:30px; height:30px;}
nav.mainnav{display:flex; gap:4px; flex-wrap:wrap; margin-inline-start:10px;}
nav.mainnav a{padding:8px 12px; border-radius:8px; font-size:.88rem; color:var(--muted); transition:.2s;}
nav.mainnav a:hover, nav.mainnav a.active{color:var(--gold-2); background:var(--panel);}
.top-actions{display:flex; align-items:center; gap:8px; margin-inline-start:auto;}
.icon-btn{width:38px; height:38px; border-radius:9px; border:1px solid var(--panel-b); background:var(--panel); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:1rem;}
.searchbox{position:relative; display:flex; align-items:center;}
.searchbox input{background:var(--panel); border:1px solid var(--panel-b); color:var(--ink); border-radius:9px; padding:8px 14px; font-family:inherit; font-size:.85rem; width:170px; transition:width .2s;}
.searchbox input:focus{width:230px; outline:none; border-color:var(--gold);}
.search-results{position:absolute; top:46px; right:0; width:320px; max-height:400px; overflow:auto; background:var(--bg2); border:1px solid var(--panel-b); border-radius:10px; box-shadow:0 20px 40px rgba(0,0,0,.4); display:none; z-index:60;}
.search-results.show{display:block;}
.search-results a{display:flex; justify-content:space-between; gap:8px; padding:10px 14px; font-size:.85rem; border-bottom:1px solid var(--line);}
.search-results a:hover{background:var(--panel);}
.search-results .tag{font-size:.68rem; color:var(--gold); border:1px solid var(--panel-b); padding:1px 6px; border-radius:5px; white-space:nowrap;}
.hamburger{display:none;}
@media (max-width:980px){
  nav.mainnav{display:none; position:absolute; top:64px; right:0; left:0; background:var(--bg2); flex-direction:column; padding:10px; border-bottom:1px solid var(--line);}
  nav.mainnav.open{display:flex;}
  .hamburger{display:flex;}
  .searchbox input{width:120px;}
  .searchbox input:focus{width:160px;}
}

/* ---- hero ---- */
.page-hero{padding:54px 0 30px; border-bottom:1px solid var(--line);}
.eyebrow{font-size:.75rem; letter-spacing:3px; text-transform:uppercase; color:var(--red-2); margin-bottom:10px;}
.page-hero h1{font-size:clamp(2.1rem,5vw,3.4rem); color:var(--gold-2);}
.page-hero p{color:var(--muted); max-width:680px; margin-top:10px;}
.crumbs{font-size:.78rem; color:var(--muted); margin-bottom:14px;}
.crumbs a{color:var(--gold); }
.crumbs span{opacity:.5; margin:0 6px;}

/* ---- home hero ---- */
.hero-home{position:relative; padding:80px 0 60px; overflow:hidden; text-align:center;}

  radial-gradient(1px 1px at 12% 25%, rgba(240,205,122,.5) 50%, transparent 51%),
  radial-gradient(1px 1px at 80% 15%, rgba(240,205,122,.35) 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 60% 70%, rgba(240,205,122,.4) 50%, transparent 51%),

.hero-home h1{font-size:clamp(2.6rem,8vw,5rem); color:var(--gold-2); text-shadow:0 4px 0 rgba(0,0,0,.3); position:relative;}
.hero-home p{color:var(--muted); max-width:600px; margin:16px auto 0; position:relative;}
.hero-search{max-width:520px; margin:34px auto 0; position:relative;}
.hero-search input{width:100%; padding:16px 20px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-b); color:var(--ink); font-family:inherit; font-size:1rem;}
.hero-search input:focus{outline:none; border-color:var(--gold);}
.hero-stats{display:flex; gap:30px; justify-content:center; margin-top:44px; flex-wrap:wrap; position:relative;}
.hero-stats div{text-align:center;}
.hero-stats b{font-family:var(--font-d); font-size:1.9rem; color:var(--gold-2); display:block;}
.hero-stats span{font-size:.78rem; color:var(--muted);}

/* ---- sections/cards ---- */
section{padding:52px 0;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:1.7rem; color:var(--gold-2);}
.section-head a.more{font-size:.8rem; color:var(--red-2); border-bottom:1px solid var(--red-2); padding-bottom:2px;}
.grid{display:grid; gap:16px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width:980px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media (max-width:620px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{background:var(--panel); border:1px solid var(--panel-b); border-radius:var(--radius); padding:16px; transition:transform .2s,border-color .2s; position:relative;}
.card:hover{transform:translateY(-4px); border-color:var(--gold);}
.avatar{width:100%; aspect-ratio:1/1; border-radius:10px; background:linear-gradient(145deg,var(--bg2),var(--bg)); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-size:2.2rem; color:var(--gold-2); border:1px solid var(--panel-b); margin-bottom:12px; overflow:hidden;}

.filterbar button.active{background:var(--gold); color:#1a1206; border-color:var(--gold);}

/* ---- detail page ---- */

.stat-table td:first-child{color:var(--muted); width:40%;}
.stat-table td:last-child{color:var(--ink); font-weight:600;}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
.tag-row span{background:var(--panel); border:1px solid var(--panel-b); font-size:.72rem; padding:3px 9px; border-radius:20px; color:var(--gold-2);}

.bio-block h3{color:var(--gold-2); margin-bottom:10px; font-size:1.25rem;}

.route{position:relative; padding-right:26px; border-right:2px dotted var(--panel-b); margin-top:20px;}
.route-item{position:relative; padding:4px 30px 36px 0;}
.route-item::before{content:""; position:absolute; right:-32px; top:6px; width:13px; height:13px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 4px var(--bg);}

.route-item h3{font-size:1.2rem; margin:6px 0;}

/* ---- tables ---- */
.datatable{width:100%; border-collapse:collapse; font-size:.85rem; margin-top:10px;}
.datatable th{text-align:right; color:var(--gold-2); padding:10px 8px; border-bottom:2px solid var(--panel-b); font-size:.78rem; letter-spacing:.5px;}
.datatable td{padding:10px 8px; border-bottom:1px solid var(--line); color:var(--ink);}
.datatable tr:hover td{background:var(--panel);}
.badge{font-size:.68rem; padding:2px 8px; border-radius:6px; border:1px solid var(--panel-b);}
.badge.canon{color:#6fcf97; border-color:#6fcf97;}
.badge.filler{color:#eb9b6f; border-color:#eb9b6f;}
.table-wrap{overflow-x:auto;}

.lb-row{display:grid; grid-template-columns:50px 60px 1fr auto; align-items:center; gap:16px; padding:14px 12px; border-bottom:1px solid var(--line);}
.lb-rank{font-family:var(--font-d); color:var(--gold); font-size:1.4rem;}
.lb-row .bounty-amt{font-family:var(--font-d); font-size:1.15rem; color:var(--gold-2);}

/* ---- compare ---- */

.compare-picker select{background:var(--panel); border:1px solid var(--panel-b); color:var(--ink); padding:10px 14px; border-radius:9px; font-family:inherit;}

/* ---- buttons ---- */
.btn{display:inline-block; padding:12px 26px; border-radius:9px; background:var(--red); color:#fff; font-family:var(--font-d); font-size:1.05rem; letter-spacing:.5px; border:none;}

footer{border-top:1px solid var(--line); padding:40px 20px; text-align:center; color:var(--muted); font-size:.8rem;}

.empty{color:var(--muted); text-align:center; padding:40px 0;}

/* =========================================================
   توابع کمکی
   ========================================================= */
const $ = (sel,el=document)=>el.querySelector(sel);
const $$ = (sel,el=document)=>[...el.querySelectorAll(sel)];
const app = $("#app");

function byId(arr,id){ return arr.find(x=>x.id===id); }
function charName(id){ const c=byId(DATA.characters,id); return c? c.name : id; }
function arcName(id){ const a=byId(DATA.arcs,id); return a? a.name : id; }
function crewName(id){ const c=byId(DATA.crews,id); return c? c.name : (id==="none"?"بدون خدمه":id); }
function fmtBounty(n){ return n>0 ? "฿ "+n.toLocaleString("en-US") : "نامشخص"; }
function initials(name){ return name.trim().split(" ")[0].slice(0,2); }
function setMeta(title, desc){
  document.title = title+" | وان‌پدیا";
  let m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", desc || title);
}
function injectJSONLD(obj){
  let old = document.getElementById("ld-json");
  if(old) old.remove();
  const s = document.createElement("script");
  s.type = "application/ld+json"; s.id = "ld-json";
  s.textContent = JSON.stringify(obj);
  document.head.appendChild(s);
}

/* ---- favorites & recently viewed (localStorage) ---- */
function getFavs(){ try{ return JSON.parse(localStorage.getItem("op_favs")||"[]"); }catch(e){ return []; } }
function saveFavs(list){ localStorage.setItem("op_favs", JSON.stringify(list)); }
function isFav(type,id){ return getFavs().some(f=>f.type===type && f.id===id); }
function toggleFav(type,id,label){
  let favs = getFavs();
  const idx = favs.findIndex(f=>f.type===type && f.id===id);
  if(idx>-1) favs.splice(idx,1); else favs.push({type,id,label});
  saveFavs(favs);
}
function pushRecent(type,id,label){
  let r = JSON.parse(localStorage.getItem("op_recent")||"[]");
  r = r.filter(x=> !(x.type===type && x.id===id));
  r.unshift({type,id,label});
  r = r.slice(0,6);
  localStorage.setItem("op_recent", JSON.stringify(r));
}
function getRecent(){ try{ return JSON.parse(localStorage.getItem("op_recent")||"[]"); }catch(e){ return []; } }

/* ---- global search index ---- */
function searchIndex(q){
  q = q.trim().toLowerCase();
  if(!q) return [];
  const out = [];
  DATA.characters.forEach(c=>{ if(c.name.toLowerCase().includes(q)||c.alias.toLowerCase().includes(q)) out.push({type:"شخصیت",label:c.name,href:"#/characters/"+c.id}); });
  DATA.arcs.forEach(a=>{ if(a.name.toLowerCase().includes(q)) out.push({type:"آرک",label:a.name,href:"#/arcs/"+a.id}); });
  DATA.devilFruits.forEach(d=>{ if(d.name.toLowerCase().includes(q)||d.nameEn.toLowerCase().includes(q)) out.push({type:"میوه شیطانی",label:d.name,href:"#/devil-fruits/"+d.id}); });
  DATA.crews.forEach(c=>{ if(c.name.toLowerCase().includes(q)) out.push({type:"خدمه",label:c.name,href:"#/crews/"+c.id}); });
  return out.slice(0,10);
}

/* =========================================================
   قالب‌های کارت (Templates)
   ========================================================= */
function charCard(c){
  const fav = isFav("character",c.id);
  return `<div class="card">
    <button class="fav-btn ${fav?"active":""}" data-fav="character:${c.id}:${c.name}" aria-label="افزودن به علاقه‌مندی‌ها">${fav?"★":"☆"}</button>
    ${c.bounty>0?`<span class="bounty-tag">${fmtBounty(c.bounty)}</span>`:""}
    <a href="#/characters/${c.id}">
      <div class="avatar">${initials(c.name)}</div>
      <h3>${c.name}</h3>
      <div class="meta">${c.alias} · ${crewName(c.crew)}</div>
    </a>
  </div>`;
}
function arcCard(a){
  return `<a href="#/arcs/${a.id}" class="card">
    <div class="avatar" style="font-size:1.1rem;">${a.name.slice(0,2)}</div>
    <h3>${a.name}</h3>
    <div class="meta">قسمت ${a.episodes} · فصل ${a.chapters}</div>
  </a>`;
}
function fruitCard(f){
  return `<a href="#/devil-fruits/${f.id}" class="card">
    <div class="avatar">🍈</div>
    <h3>${f.name}</h3>
    <div class="meta">${f.type} · کاربر: ${typeof byId(DATA.characters,f.user)==="object"?charName(f.user):f.user}</div>
  </a>`;
}
function crewCard(c){
  return `<a href="#/crews/${c.id}" class="card">
    <div class="avatar">⚑</div>
    <h3>${c.name}</h3>
    <div class="meta">${c.type} · رهبر: ${charName(c.leader)}</div>
  </a>`;
}
function crumbs(items){
  return `<div class="crumbs">${items.map((it,i)=> i<items.length-1 ? `<a href="${it.href}">${it.label}</a><span>/</span>` : `${it.label}`).join("")}</div>`;
}

/* =========================================================
   روتر
   ========================================================= */
function bindFavButtons(){
  $$("[data-fav]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.preventDefault();
      const [type,id,label] = btn.dataset.fav.split(":");
      toggleFav(type,id,label);
      btn.classList.toggle("active");
      btn.textContent = btn.classList.contains("active") ? "★" : "☆";
    });
  });
}

function router(){
  const hash = location.hash.replace(/^#/,"") || "/";
  const parts = hash.split("/").filter(Boolean);
  window.scrollTo(0,0);
  $$("nav.mainnav a").forEach(a=> a.classList.toggle("active", a.getAttribute("href")==="#/"+parts[0]));
  $("#mainNav").classList.remove("open");

  if(parts.length===0){ viewHome(); return; }
  const [section,slug] = parts;
  switch(section){
    case "characters": slug? viewCharacterDetail(slug) : viewCharacterList(); break;
    case "arcs": slug? viewArcDetail(slug) : viewArcList(); break;
    case "devil-fruits": slug? viewFruitDetail(slug) : viewFruitList(); break;
    case "crews": slug? viewCrewDetail(slug) : viewCrewList(); break;
    case "haki": viewHaki(); break;
    case "bounties": viewBounties(); break;
    case "battles": viewBattles(); break;
    case "episodes": viewEpisodes(); break;
    case "manga": viewManga(); break;
    case "compare": viewCompare(); break;
    case "favorites": viewFavorites(); break;
    default: view404();
  }
  bindFavButtons();
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", ()=>{
  router();
  const saved = localStorage.getItem("op_theme");
  if(saved==="light"){ document.body.setAttribute("data-theme","light"); }
  $("#themeToggle").addEventListener("click", ()=>{
    const cur = document.body.getAttribute("data-theme");
    const next = cur==="light" ? "dark" : "light";
    document.body.setAttribute("data-theme", next);
    localStorage.setItem("op_theme", next);
  });
  $("#hamburgerBtn").addEventListener("click", ()=> $("#mainNav").classList.toggle("open"));
  const ts = $("#topSearch"), tr = $("#searchResults");
  ts.addEventListener("input", ()=>{
    const res = searchIndex(ts.value);
    tr.innerHTML = res.length? res.map(r=>`<a href="${r.href}">${r.label}<span class="tag">${r.type}</span></a>`).join("") : `<div style="padding:14px;color:var(--muted);font-size:.85rem;">نتیجه‌ای یافت نشد</div>`;
    tr.classList.toggle("show", ts.value.trim().length>0);
  });
  document.addEventListener("click",(e)=>{
    if(!e.target.closest(".searchbox")){ $$(".search-results").forEach(r=>r.classList.remove("show")); }
  });
});
</script>
